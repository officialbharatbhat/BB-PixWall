name: Lite v1.1 compile check

on:
  push:
    branches: [lite-edition]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Kotlin and resources
        env:
          ORG_GRADLE_PROJECT_BBPIX_STORE_FILE: placeholder.keystore
          ORG_GRADLE_PROJECT_BBPIX_STORE_PASSWORD: placeholder
          ORG_GRADLE_PROJECT_BBPIX_KEY_ALIAS: placeholder
          ORG_GRADLE_PROJECT_BBPIX_KEY_PASSWORD: placeholder
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
